<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global AV Partner Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="av-global-partner-network.css">
</head>
<body>

<div class="global-network-section">
  <!-- Left Panel -->
  <div class="left-panel bg-white">
    <button class="close-sidebar-button"><i class="bi bi-x-lg"></i></button>
    <div class="logo-form-section">
    <div class="logo text-center">
      <img src="https://avchamps.com/assets/images/logo.png" alt="Logo">
    </div>

    <select class="form-select shadow-none" aria-label="Select country">
      <option selected>Select country</option>
      <option value="1">India</option>
      <option value="2">USA</option>
    </select>

    <select class="form-select shadow-none" aria-label="Select city">
      <option selected>Select city</option>
      <option value="1">Delhi</option>
      <option value="2">Mumbai</option>
    </select>

    <input type="text" class="form-control" placeholder="Type OEM name">

</div>

<div class="form-check-section border-top border-bottom">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="" id="distributors">
      <label class="form-check-label" for="distributors">
        Distributers
      </label>
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="" id="integrator">
      <label class="form-check-label" for="integrator">
        System Integrator
      </label>
    </div>

</div>

    <div class="tooltip-btn-wrapper mt-4" data-bs-toggle="tooltip" data-bs-placement="top" title="Be a part of largest AV Global partner network today">
      <button class="btn btn-primary btn-add" data-bs-toggle="modal" data-bs-target="#addNewPartner">ADD</button>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="globe-section">
    <button class="mobile-menu-btn"><i class="bi bi-list"></i></button>
      <h1>GLOBAL AV PARTNER NETWORK</h1>
      <!-- <video src="video/global-network-video.mp4" autoplay controls ></video> -->
<div class="information-section">
  <iframe
  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d62268.875965410366!2d77.67280106617784!3d12.900349738228954!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bae13430aa25fd3%3A0x31508e40eb2695ef!2sCrestron%20Software%20Development%20India%20Pvt.%20Ltd.!5e0!3m2!1sen!2sin!4v1691229934244!5m2!1sen!2sin"
  width="100%"
  height="400"
  style="border:0;"
  allowfullscreen=""
  loading="lazy"
  referrerpolicy="no-referrer-when-downgrade">
</iframe>
  <div class="d-flex justify-content-center mt-4 border-top border-bottom">
    <div class="legend-item">
      <span class="legend-dot dot-blue"></span>
      <span class="legend-label">Distributers</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot dot-green"></span>
      <span class="legend-label">System Integrator</span>
    </div>
  </div>


  <div class="row g-4 mt-4">
    <!-- Card 1 -->
    <div class="col-md-3">
      <div class="partner-card">
        <div class="partner-name">Distributer -1</div>
        <div class="partner-address">ADDRESS</div>
        <div class="status-dot status-distributor"></div>
        <i class="bi bi-link-45deg link-icon"></i>
      </div>
    </div>
      <!-- Card 2 -->
      <div class="col-md-3">
      <div class="partner-card">
        <div class="partner-name">Distributer -2</div>
        <div class="partner-address">ADDRESS</div>
        <div class="status-dot status-distributor"></div>
        <i class="bi bi-link-45deg link-icon"></i>
      </div>
  </div>
      <!-- Card 3 -->
      <div class="col-md-3">
      <div class="partner-card">
        <div class="partner-name">System Integrator-1</div>
        <div class="partner-address">ADDRESS</div>
        <div class="status-dot status-integrator"></div>
        <i class="bi bi-link-45deg link-icon"></i>
      </div>
      </div>
      <div class="col-md-3">
        <div class="partner-card">
          <div class="partner-name">System Integrator-1</div>
          <div class="partner-address">ADDRESS</div>
          <div class="status-dot status-integrator"></div>
          <i class="bi bi-link-45deg link-icon"></i>
        </div>
        </div>

  
    <div class="more-text d-flex justify-content-end mt-3"><button class="btn btn-outline-secondary shadow-none fw-bold text-black view-more-btn">View More</button></div>
  </div>
</div>
  </div>
</div>


 <!-- Certificate or license modal -->
 <div class="modal fade" id="addNewPartner" tabindex="-1" aria-labelledby="addNewPartnerModalLabel"
   aria-hidden="true">
   <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
     <div class="modal-content">
       <div class="modal-header">
         <h5 class="modal-title" id="addNewPartnerModalLabel">
            <i class="bi bi-person-plus me-2 icon"></i> Add New Partner</h5>
         <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
       </div>

       <div class="modal-body">
         <form id="licenseCertForm" class="form-section">
           <div id="certificateFieldsContainer">
             <div class="certificate-block">
                <div class="mb-3">
                    <label class="form-label">Partner Name <span class="text-danger">*</span></label>
                    <div class="d-flex justify-content-start align-items-center">
                    <div class="form-check me-4">
                        <input class="form-check-input" type="checkbox" value="" id="oem">
                        <label class="form-check-label" for="oem">
                          OEM
                        </label>
                      </div>
                      <div class="form-check me-4">
                        <input class="form-check-input" type="checkbox" value="" id="distributer">
                        <label class="form-check-label" for="distributer">
                          Distributer
                        </label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="system-integrator">
                        <label class="form-check-label" for="system-integrator">
                          System Integrator
                        </label>
                      </div>
                    </div>
                  </div>
               <div class="mb-3">
                 <label class="form-label">Partner Name <span class="text-danger">*</span></label>
                 <input type="text" class="form-control"
                   placeholder="Select Partner Name" required>
               </div>
               <div class="row">
                 <div class="col-md-6 mb-3">
                        <label class="form-label">Country <span class="text-danger">*</span></label>
                        <input type="text" class="form-control"
                          placeholder="Enter Country" required>
                 </div>
                 <div class="col-md-6 mb-3">
                        <label class="form-label">City <span class="text-danger">*</span></label>
                        <input type="text" class="form-control"
                          placeholder="Enter City" required>
                 </div>
               </div>

               <div class="row">
                <div class="col-md-6 mb-3">
                       <label class="form-label">Latitude</label>
                       <input type="text" class="form-control"
                         placeholder="Enter Latitude">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Longitude</label>
                    <input type="text" class="form-control"
                      placeholder="Enter Longitude">
             </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Website Link<span class="text-danger">*</span></label>
                <input type="text" class="form-control"
                  placeholder="Ex: www.xyz.com" required>
              </div>

              <div>
                <label class="form-label">Details<span class="text-danger">*</span></label>
                <textarea class="form-control"
                  placeholder="Enter Details" required style="min-height: 150px;">
                  </textarea>
              </div>

             </div>
           </div>
         </form>

       </div>

       <div class="modal-footer">
         <!-- <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button> -->
         <button type="submit" class="btn btn-primary">Submit</button>
       </div>
     </div>
   </div>
 </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Enable tooltips
  var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
  tooltipTriggerList.forEach(function (tooltipTriggerEl) {
    new bootstrap.Tooltip(tooltipTriggerEl);
  });
</script>

<script>
    const video = document.getElementById('customVideo');
    const playBtn = document.getElementById('playButton');
  
    playBtn.addEventListener('click', function () {
      video.play().then(() => {
        playBtn.classList.add('hidden');
      }).catch((err) => {
        console.error('Video playback failed:', err);
      });
    });
  
    video.addEventListener('play', () => {
      playBtn.classList.add('hidden');
    });
  
    video.addEventListener('pause', () => {
      playBtn.classList.remove('hidden');
    });
  </script>
  <script>
    const mobileBtn = document.querySelector('.mobile-menu-btn');
    const closeBtn = document.querySelector('.close-sidebar-button');
    const sidebar = document.querySelector('.left-panel');
  
    mobileBtn.addEventListener('click', () => {
      sidebar.classList.add('open');
    });
  
    closeBtn.addEventListener('click', () => {
      sidebar.classList.remove('open');
    });
  </script>
</body>
</html>
